<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Градиент для рамки и буквы N -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Эффект мягкого свечения -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Темный фон -->
  <rect width="512" height="512" rx="64" fill="#0b0f19" />

  <!-- Группа логотипа с применением свечения -->
  <g filter="url(#glow)">
    <!-- Шестиугольник (Hexagon) -->
    <polygon points="256,70 410,159 410,337 256,426 102,337 102,159" 
             fill="none" 
             stroke="url(#neonGradient)" 
             stroke-width="28" 
             stroke-linejoin="round" />

    <!-- Буква N -->
    <path d="M 182,342 L 182,170 L 330,342 L 330,170" 
          fill="none" 
          stroke="url(#neonGradient)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
