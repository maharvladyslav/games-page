<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora</title>
    <link rel="stylesheet" href="./src/css/reset.css" />
  </head>
  <body>
    <header></header>
    <main>
      <div class="controls">
        <ul class="controls-list">
          <li class="controls-item">
            <button class="constrols-btn" data-controls="add">Додати</button>
          </li>
          <li class="controls-item">
            <button class="constrols-btn" data-controls="reset">Видалити всі ігри</button>
          </li>
          <li class="controls-item">
            <button class="constrols-btn" data-controls="good-game">Показати круті ігри</button>
          </li>
          <li class="controls-item">
            <button class="constrols-btn" data-controls="pc-game">Ігри на пк</button>
          </li>
        </ul>
        <ul class="sort-list">
          <li class="sort-item">
            <button class="sort-btn" data-sort-type="pc-game">Від а до я </button>
          </li>
        </ul>
      </div>
      <div class="game-container" data-games></div>
    </main>
    <footer></footer>
    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
